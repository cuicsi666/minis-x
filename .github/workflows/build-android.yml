name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/android/**'
      - 'deps/**'
      - 'scripts/prepare_android_sandbox.sh'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Init proot submodule
        run: |
          git submodule update --init --recursive deps/proot
          ls deps/proot | head

      - name: Ensure exec bits
        run: |
          chmod +x deps/*.sh scripts/*.sh src/android/gradlew || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Set up Android SDK (use runner preinstalled)
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          ls "$SDK"

      - name: Install NDK r28 + platform 36 + cmake + build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "ndk;28.0.12433566" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/28.0.12433566" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/28.0.12433566" >> "$GITHUB_ENV"
          ls "${ANDROID_SDK_ROOT}/ndk"

      - name: Pin Gradle ndkVersion
        run: |
          sed -i 's/^android {/android {\n    ndkVersion = "28.0.12433566"/' src/android/app/build.gradle.kts
          sed -n '26,42p' src/android/app/build.gradle.kts

      - name: Setup gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init

      - name: Build proot (native)
        run: ./deps/build_proot.sh

      - name: Prepare Alpine sandbox
        run: ./scripts/prepare_android_sandbox.sh

      - name: Build rclone .aar
        run: |
          ./deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/
          ls -la src/android/app/libs/

      - name: Provider customization file
        run: |
          cd src/android/app
          if [ ! -f provider-customization.properties ]; then
            cp provider-customization.properties.example provider-customization.properties
          fi
          echo "created: $(ls provider-customization.properties)"

      - name: Build debug APK
        working-directory: src/android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: Locate APK
        if: always()
        run: find src/android/app/build/outputs -name '*.apk' -exec ls -la {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: minis-android-debug-apk
          path: src/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /tmp/gradle.log
          if-no-files-found: warn
